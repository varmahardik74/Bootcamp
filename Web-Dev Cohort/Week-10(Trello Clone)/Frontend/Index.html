<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trello Clone</title>
  <link rel="stylesheet" href="style.css">

  
</head>

<body>
  <header>
    <div class="header-left">
      <h1>Trello Clone</h1>
      <span class="user-pill" id="userPill">Loading user...</span>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <main>
    <section class="welcome">
      <div>
        <h2>My Boards</h2>
        <p>Create and manage your Trello boards and tasks stored in the backend in-memory database.</p>
      </div>
      <div class="header-actions">
        <button class="btn-secondary" onclick="loadBoardsAndTasks()">🔄 Refresh</button>
        <button class="btn-primary" onclick="openCreateBoardModal()">+ New Board</button>
      </div>
    </section>

    <!-- Boards Section -->
    <section class="boards" id="boardsContainer">
      <div class="loading-spinner">Loading boards and tasks from backend...</div>
    </section>
  </main>

  <!-- Create Board Modal -->
  <div class="modal-overlay" id="createBoardModal">
    <div class="modal">
      <h3>Create New Board</h3>
      <div class="modal-input-group">
        <label for="boardTitleInput">Board Title</label>
        <input type="text" id="boardTitleInput" placeholder="e.g. Sprint Tasks, Product Launch" onkeydown="if(event.key==='Enter') submitCreateBoard()" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeCreateBoardModal()">Cancel</button>
        <button class="btn-primary" onclick="submitCreateBoard()">Create Board</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script>
    // State management
    let boards = [];
    let issues = [];
    let token = localStorage.getItem("token");

    // Initialize application
    document.addEventListener("DOMContentLoaded", async () => {
      await ensureAuthenticated();
      await loadBoardsAndTasks();
    });

    // Helper: Escape HTML to prevent injection
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Toast alert
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.style.display = "block";
      setTimeout(() => {
        toast.style.display = "none";
      }, 3000);
    }

    // Authentication check and auto-demo login fallback
    async function ensureAuthenticated() {
      if (token) {
        const username = localStorage.getItem("username") || "User";
        document.getElementById("userPill").textContent = "Logged in: " + username;
        return;
      }

      // If no token exists, log in with default seeded user for instant seamless experience
      try {
        const res = await fetch("/signin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: "testuser", password: "password123" })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          token = data.token;
          localStorage.setItem("token", token);
          localStorage.setItem("username", "testuser");
          document.getElementById("userPill").textContent = "Logged in: testuser";
        } else {
          window.location.href = "./signin.html";
        }
      } catch (err) {
        console.error("Auth check failed:", err);
        document.getElementById("userPill").textContent = "Offline / No Auth";
      }
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      window.location.href = "./signin.html";
    }

    // Fetch and render boards + issues from backend
    async function loadBoardsAndTasks() {
      const container = document.getElementById("boardsContainer");
      try {
        // Fetch boards from backend
        const boardsRes = await fetch("/boards", {
          headers: { "token": token }
        });

        if (boardsRes.status === 403) {
          showToast("Session expired. Please log in again.");
          logout();
          return;
        }

        const boardsData = await boardsRes.json();
        boards = boardsData.boards || [];

        // Fetch all issues from backend
        const issuesRes = await fetch("/issues", {
          headers: { "token": token }
        });
        const issuesData = await issuesRes.json();
        issues = issuesData.issues || [];

        renderBoards();
      } catch (err) {
        console.error("Failed to load backend data:", err);
        container.innerHTML = `<div class="loading-spinner" style="color: #de350b;">Failed to connect to backend server. Make sure port 3000 is active.</div>`;
      }
    }

    // Render all boards and tasks into the .boards DOM container
    function renderBoards() {
      const container = document.getElementById("boardsContainer");
      container.innerHTML = "";

      // 1. Render dynamic board-card DOM components for each board
      boards.forEach(board => {
        const boardCard = createBoardCardDOM(board);
        container.appendChild(boardCard);
      });

      // 2. Render the + Create New Board card at the end
      const createBoardCard = document.createElement("div");
      createBoardCard.className = "board-card create-board";
      createBoardCard.onclick = openCreateBoardModal;
      createBoardCard.innerHTML = `
        <div class="create-board-icon">+</div>
        <div>Create New Board</div>
      `;
      container.appendChild(createBoardCard);
    }

    // Construct a board-card DOM element
    function createBoardCardDOM(board) {
      const boardIssues = issues.filter(issue => Number(issue.boardId) === Number(board.id));

      const card = document.createElement("div");
      card.className = "board-card";
      card.id = `board-card-${board.id}`;

      // Board Card Header
      const header = document.createElement("div");
      header.className = "board-card-header";
      header.innerHTML = `
        <h3>${escapeHtml(board.title)}</h3>
        <span class="board-card-badge">#${board.id}</span>
      `;
      card.appendChild(header);

      // Board Card Body
      const body = document.createElement("div");
      body.className = "board-card-body";

      // Tasks Header
      const tasksHeader = document.createElement("div");
      tasksHeader.className = "tasks-header";
      tasksHeader.innerHTML = `
        <span>Tasks</span>
        <span id="task-count-${board.id}">${boardIssues.length}</span>
      `;
      body.appendChild(tasksHeader);

      // Tasks List container
      const tasksList = document.createElement("div");
      tasksList.className = "tasks-list";
      tasksList.id = `tasks-list-${board.id}`;

      if (boardIssues.length === 0) {
        tasksList.innerHTML = `<div class="no-tasks">No tasks on this board yet</div>`;
      } else {
        boardIssues.forEach(task => {
          tasksList.appendChild(createTaskItemDOM(task));
        });
      }
      body.appendChild(tasksList);

      // Add Task Section
      const addTaskSection = document.createElement("div");
      addTaskSection.className = "add-task-section";

      const showFormBtn = document.createElement("button");
      showFormBtn.className = "add-task-btn";
      showFormBtn.id = `show-form-btn-${board.id}`;
      showFormBtn.textContent = "+ Add a task";
      showFormBtn.onclick = () => toggleTaskForm(board.id, true);

      // Inline form to add task
      const inlineForm = document.createElement("div");
      inlineForm.className = "inline-task-form";
      inlineForm.id = `inline-form-${board.id}`;
      inlineForm.innerHTML = `
        <input type="text" id="task-title-input-${board.id}" placeholder="Enter task title..." />
        <textarea id="task-desc-input-${board.id}" rows="2" placeholder="Task description (optional)"></textarea>
        <div class="inline-form-actions">
          <button class="btn-primary" onclick="submitCreateTask(${board.id})">Add Task</button>
          <button class="btn-secondary" onclick="toggleTaskForm(${board.id}, false)">Cancel</button>
        </div>
      `;

      addTaskSection.appendChild(showFormBtn);
      addTaskSection.appendChild(inlineForm);
      body.appendChild(addTaskSection);

      card.appendChild(body);
      return card;
    }

    // Construct a task-item DOM element
    function createTaskItemDOM(task) {
      const taskDiv = document.createElement("div");
      taskDiv.className = `task-item status-${task.status || "todo"}`;
      taskDiv.id = `task-item-${task.id}`;

      const status = task.status || "todo";
      const statusLabel = status.replace("_", " ");

      taskDiv.innerHTML = `
        <div class="task-top">
          <div class="task-title">${escapeHtml(task.title)}</div>
        </div>
        ${task.description ? `<div class="task-desc">${escapeHtml(task.description)}</div>` : ""}
        <div class="task-footer">
          <span class="status-badge ${status}">${statusLabel}</span>
          <div class="task-controls">
            <select class="task-select" onchange="updateTaskStatus(${task.id}, this.value)">
              <option value="todo" ${status === "todo" ? "selected" : ""}>Todo</option>
              <option value="in_progress" ${status === "in_progress" ? "selected" : ""}>In Progress</option>
              <option value="done" ${status === "done" ? "selected" : ""}>Done</option>
            </select>
            <button class="task-delete-btn" title="Delete task" onclick="deleteTask(${task.id}, ${task.boardId})">✕</button>
          </div>
        </div>
      `;
      return taskDiv;
    }

    // Toggle inline task form
    function toggleTaskForm(boardId, show) {
      const form = document.getElementById(`inline-form-${boardId}`);
      const btn = document.getElementById(`show-form-btn-${boardId}`);
      if (show) {
        form.style.display = "flex";
        btn.style.display = "none";
        document.getElementById(`task-title-input-${boardId}`).focus();
      } else {
        form.style.display = "none";
        btn.style.display = "block";
      }
    }

    // Modal controls for creating board
    function openCreateBoardModal() {
      const modal = document.getElementById("createBoardModal");
      const input = document.getElementById("boardTitleInput");
      input.value = "";
      modal.style.display = "flex";
      input.focus();
    }

    function closeCreateBoardModal() {
      document.getElementById("createBoardModal").style.display = "none";
    }

    // Legacy prompt compatibility for createBoard()
    function createBoard() {
      openCreateBoardModal();
    }

    // Submit POST /board to backend endpoint
    async function submitCreateBoard() {
      const input = document.getElementById("boardTitleInput");
      const title = input.value.trim();

      if (!title) {
        alert("Please enter a board title");
        return;
      }

      try {
        const res = await fetch("/board", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "token": token
          },
          body: JSON.stringify({ title })
        });

        const data = await res.json();
        if (res.ok && data.board) {
          boards.push(data.board);
          closeCreateBoardModal();
          showToast(`Board "${data.board.title}" created successfully!`);

          // Dynamically append the DOM component right before the create-board card
          const container = document.getElementById("boardsContainer");
          const createCard = container.querySelector(".create-board");
          const newBoardCard = createBoardCardDOM(data.board);
          container.insertBefore(newBoardCard, createCard);
        } else {
          alert(data.message || "Failed to create board");
        }
      } catch (err) {
        console.error("Create board error:", err);
        alert("Error creating board: " + err.message);
      }
    }

    // Submit POST /issue to backend endpoint
    async function submitCreateTask(boardId) {
      const titleInput = document.getElementById(`task-title-input-${boardId}`);
      const descInput = document.getElementById(`task-desc-input-${boardId}`);

      const title = titleInput.value.trim();
      const description = descInput.value.trim();

      if (!title) {
        alert("Please enter a task title");
        return;
      }

      try {
        const res = await fetch("/issue", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "token": token
          },
          body: JSON.stringify({
            title,
            description,
            boardId,
            status: "todo"
          })
        });

        const data = await res.json();
        if (res.ok && data.issue) {
          issues.push(data.issue);
          titleInput.value = "";
          descInput.value = "";
          toggleTaskForm(boardId, false);
          showToast(`Task "${data.issue.title}" added to board!`);

          // Update tasks list DOM for this board
          const tasksList = document.getElementById(`tasks-list-${boardId}`);
          const noTasksEl = tasksList.querySelector(".no-tasks");
          if (noTasksEl) noTasksEl.remove();

          const taskDOM = createTaskItemDOM(data.issue);
          tasksList.appendChild(taskDOM);

          // Update task count badge
          const countEl = document.getElementById(`task-count-${boardId}`);
          if (countEl) {
            const currentCount = issues.filter(i => Number(i.boardId) === Number(boardId)).length;
            countEl.textContent = currentCount;
          }
        } else {
          alert(data.message || "Failed to add task");
        }
      } catch (err) {
        console.error("Create task error:", err);
        alert("Error adding task: " + err.message);
      }
    }

    // Submit PUT /issues to update task status
    async function updateTaskStatus(issueId, newStatus) {
      try {
        const res = await fetch("/issues", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "token": token
          },
          body: JSON.stringify({
            issueId,
            status: newStatus
          })
        });

        const data = await res.json();
        if (res.ok && data.issue) {
          const taskIndex = issues.findIndex(i => i.id === Number(issueId));
          if (taskIndex !== -1) {
            issues[taskIndex].status = newStatus;
          }

          // Update the DOM element classes and badge
          const taskDiv = document.getElementById(`task-item-${issueId}`);
          if (taskDiv) {
            taskDiv.className = `task-item status-${newStatus}`;
            const badge = taskDiv.querySelector(".status-badge");
            if (badge) {
              badge.className = `status-badge ${newStatus}`;
              badge.textContent = newStatus.replace("_", " ");
            }
          }
          showToast("Task status updated to " + newStatus.replace("_", " "));
        } else {
          alert(data.message || "Failed to update task status");
        }
      } catch (err) {
        console.error("Update task error:", err);
        alert("Error updating task: " + err.message);
      }
    }

    // Submit DELETE /issue to remove a task
    async function deleteTask(issueId, boardId) {
      if (!confirm("Are you sure you want to delete this task?")) return;

      try {
        const res = await fetch("/issue", {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json",
            "token": token
          },
          body: JSON.stringify({ issueId })
        });

        const data = await res.json();
        if (res.ok) {
          issues = issues.filter(i => i.id !== Number(issueId));
          const taskDiv = document.getElementById(`task-item-${issueId}`);
          if (taskDiv) taskDiv.remove();

          // Check if board tasks list is now empty
          const tasksList = document.getElementById(`tasks-list-${boardId}`);
          if (tasksList && tasksList.children.length === 0) {
            tasksList.innerHTML = `<div class="no-tasks">No tasks on this board yet</div>`;
          }

          // Update task count badge
          const countEl = document.getElementById(`task-count-${boardId}`);
          if (countEl) {
            const currentCount = issues.filter(i => Number(i.boardId) === Number(boardId)).length;
            countEl.textContent = currentCount;
          }

          showToast("Task deleted");
        } else {
          alert(data.message || "Failed to delete task");
        }
      } catch (err) {
        console.error("Delete task error:", err);
        alert("Error deleting task: " + err.message);
      }
    }
  </script>
</body>
</html>
